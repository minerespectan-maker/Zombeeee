name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Android setup
        run: |
          mkdir -p /root/.config/godot build
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore /root/ci-debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          JDK="${JAVA_HOME:-$(dirname $(dirname $(readlink -f $(which javac))))}"
          echo "SDK=$SDK JDK=$JDK"
          for f in editor_settings-4.tres editor_settings-4.3.tres; do
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "/root/ci-debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$SDK" "$JDK" > /root/.config/godot/$f
          done

      - name: Import project
        run: HOME=/root godot --headless --import || true

      - name: Export APK
        run: HOME=/root godot --headless --export-debug "Android" build/zombie30.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zombie30-apk
          path: build/zombie30.apk
